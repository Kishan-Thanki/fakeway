name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.mod

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Build Binary
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X github.com/kishan-thanki/fakeway/internal/httpapi.Version=ci" \
            -o fakeway .

  docker-smoke:
    name: Docker Scratch Image Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build --build-arg VERSION=ci -t fakeway:ci .

      - name: Smoke Test Container Endpoint
        run: |
          set -eu
          CONTAINER_NAME="fakeway-smoke-$(date +%s)"
          
          # Start the container in the background
          docker run --detach --name "$CONTAINER_NAME" -p "127.0.0.1:18081:8080" fakeway:ci >/dev/null
          
          # Ensure container is always cleaned up on exit
          trap 'docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true' EXIT
          
          echo "Waiting for Fakeway container to become healthy..."
          for i in $(seq 1 50); do
            if curl --fail --silent "http://127.0.0.1:18081/health" >/dev/null 2>&1; then
              echo "Docker smoke test passed successfully."
              exit 0
            fi
            sleep 0.2
          done
          
          echo "Docker smoke test timed out. Container logs:"
          docker logs "$CONTAINER_NAME" || true
          exit 1
